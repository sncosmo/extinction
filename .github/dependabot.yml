version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week before updating to a new release.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # Wait a week before updating to a new release.
    cooldown:
      default-days: 7
    groups:
      python-packages:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    # Wait a week before updating to a new release.
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"
