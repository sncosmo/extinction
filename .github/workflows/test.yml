# This workflow uses uv to install the locked dependencies from uv.lock and
# run the tests, and uses prek to run the hooks in .pre-commit-config.yaml.

name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:

    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
      fail-fast: false

    runs-on: ubuntu-latest

    name: Test on python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          check-latest: true
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run tests
        # Use the Python from setup-python, which also supplies pre-releases.
        # Install only the test group, because the other groups do not have
        # wheels for all of the Python versions.
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv run --locked --no-default-groups --group test pytest

  lint:
    runs-on: ubuntu-latest
    name: Run prek hooks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
