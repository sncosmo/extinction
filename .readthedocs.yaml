version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    # Read the Docs runs `uv sync --group docs`, which installs the versions
    # in uv.lock. It cannot pass --no-default-groups, so uv also installs the
    # default dev group, which includes docs. conf.py imports extinction to
    # read the version, and the plot directives call into it, so this also
    # installs the project with its compiled extension.
    - method: uv
      command: sync
      groups:
        - docs
