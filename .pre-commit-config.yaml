# Run with prek (https://github.com/j178/prek) or pre-commit:
#   uvx prek install   # run the hooks on each commit
#   uvx prek run -a    # run the hooks on all files
# Leave vendored code and test data byte for byte as upstream supplied them.
exclude: ^(extern|tests/testdata)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      # Use LF line endings, not CRLF.
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      # Make sure that uv.lock agrees with pyproject.toml.
      - id: uv-lock

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      # Find security problems in the GitHub Actions workflows.
      - id: zizmor

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
