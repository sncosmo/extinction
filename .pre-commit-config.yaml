# Run with prek (https://github.com/j178/prek) or pre-commit:
#   uv tool install prek   # a hook installed with uvx breaks after uv cache clean
#   prek install           # run the hooks on each commit
#   prek run -a            # run the hooks on all files
# Leave vendored code and test data byte for byte as upstream supplied them.
exclude: ^(extern|tests/testdata)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      # Use LF line endings, not CRLF.
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      # Make sure that uv.lock agrees with pyproject.toml.
      - id: uv-lock

  - repo: local
    hooks:
      - id: ty
        name: ty check
        # ty reads the stub in src/, so do not install the project, which
        # compiles the extension and needs a C compiler. numpy comes in
        # through matplotlib in the docs group.
        entry: uv run --locked --only-group dev ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        # Also run when only pyproject.toml or uv.lock changes, which can
        # change the result, and on commits that only delete files.
        always_run: true
