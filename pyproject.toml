[build-system]
requires = [
    "setuptools>=77",
    # 3.1 is the first release that honours the freethreading_compatible
    # directive in extinction.pyx; earlier versions silently ignore it and
    # emit a module that re-enables the GIL on free-threaded interpreters.
    "Cython>=3.1",
    "numpy>=2",
]
build-backend = "setuptools.build_meta"

[project]
name = "extinction"
description = "Fast interstellar dust extinction laws"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kyle Barbary", email = "kylebarbary@gmail.com" }]
requires-python = ">=3.10"
# Wheels are built against numpy 2, which stays ABI compatible back to 1.19.3.
dependencies = ["numpy>=1.19.3"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[dependency-groups]
test = ["pytest"]
docs = ["matplotlib", "numpydoc", "sphinx", "sphinx-rtd-theme"]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ty",
    # The build requirements, so that ty can check setup.py. The ty hook does
    # not install the project, so numpy here is also what ty uses for the
    # stub and the tests.
    "Cython>=3.1",
    "numpy>=2",
    "setuptools>=77",
]

[project.urls]
Homepage = "https://github.com/sncosmo/extinction"
Documentation = "https://extinction.readthedocs.io"
Source = "https://github.com/sncosmo/extinction"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 marker and stubs for the compiled module.
[tool.setuptools.package-data]
extinction = ["py.typed", "*.pyi"]

# The Cython source belongs in the sdist, not in binary wheels; now that it
# lives inside the package directory, MANIFEST.in would otherwise pull it in.
# setup.py regenerates the C next to it on every build, so neither the sdist
# (see MANIFEST.in) nor the wheels ship the C.
[tool.setuptools.exclude-package-data]
extinction = ["*.pyx", "*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["extern"]

# uv rebuilds the project only when one of these changes, and this list
# replaces the default one. Add the Cython and C sources, so that `uv run` and
# `uv sync` rebuild the compiled extension after they change. Also rebuild
# when .venv is created again: the editable install builds the extension in
# src/extinction, outside .venv, and `git clean -fdx` deletes both.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/extinction/*.pyx" },
    { file = "extern/*" },
    { dir = ".venv" },
]

[tool.cibuildwheel]
build-frontend = "build[uv]"
# numpy has no Windows ARM64 wheels for Python 3.10, and its source build fails
# on windows-11-arm. cibuildwheel would stop there, before it builds the wheels
# for the newer Python versions.
skip = ["cp310-win_arm64"]
test-groups = ["test"]
test-command = "pytest {project}/tests"
